name: Build JahanNama APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4

      - name: استخراج نسخه جدید
        run: |
          unzip -o JahanNama_v1.5.0_Source.zip \
            -x '.github/workflows/build-apk.yml' \
            -d .

      - name: نصب جاوا
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: آماده‌سازی گِرِیدل
        uses: gradle/actions/setup-gradle@v4

      - name: ساخت برنامه
        run: gradle assembleDebug

      - name: دریافت فایل نصب
        uses: actions/upload-artifact@v4
        with:
          name: JahanNama-v1.5.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
