<section class="panel home-panel" id="home"><h2>به جهان نما خوش آمدید</h2><p class="muted">برای ادامه، بخش موردنظر را انتخاب کنید.</p><div class="home-actions"><button class="home-action" onclick="showStudent()"><span>📝</span> آزمون‌ها</button><button class="home-action" onclick="adminLogin()"><span>📚</span> مدیریت آزمون‌ها</button><button class="home-action secondary" onclick="alert('کارنامه پس از شرکت در آزمون و ثبت نتیجه در دسترس مدیر است.')"><span>📊</span> کارنامه</button><button class="home-action secondary" onclick="alert('برای شرکت در آزمون، پایه و نوع آزمون را انتخاب کنید؛ سپس نام خود را وارد کرده و پاسخ دهید.')"><span>❔</span> راهنما</button></div></section>
<section class="panel hidden" id="student"><h2>شرکت در آزمون</h2>
