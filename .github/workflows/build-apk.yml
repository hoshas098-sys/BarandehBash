
name: ساخت جهان‌نما

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت مخزن
        uses: actions/checkout@v4

      - name: آماده‌سازی جاوا
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: استخراج سورس جهان‌نما
        run: |
          mkdir -p /tmp/jahannama
          unzip -o JahanNama_GitHub_APK.zip -d /tmp/jahannama
          cp -a /tmp/jahannama/. .

      - name: آماده‌سازی گریدل
        uses: gradle/actions/setup-gradle@v4

      - name: ساخت برنامه
        run: gradle assembleDebug

      - name: ذخیره فایل نصبی
        uses: actions/upload-artifact@v4
        with:
          name: JahanNama-APK
          path: app/build/outputs/apk/debug/app-debug.apk
