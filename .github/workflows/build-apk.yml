<label>درس</label><select id="subject"><option>مطالعات اجتماعی</option></select>
<label>نوع آزمون</label><select id="examType"><option>درس به درس</option><option>تکمیلی</option><option>نوبت اول</option><option>نوبت دوم</option></select>
<div id="studentExams"></div><button class="secondary" onclick="goHome()">بازگشت</button></section>
<section class="panel hidden" id="identity"><h2>مشخصات دانش‌آموز</h2><p class="muted">نام و نام خانوادگی الزامی است؛ مدرسه و کلاس اختیاری هستند.</p>
<input id="fullName" placeholder="نام و نام خانوادگی *"><input id="school" placeholder="نام مدرسه (اختیاری)"><input id="className" placeholder="کلاس (اختیاری)">
<button onclick="beginStudentQuiz()">شروع آزمون</button><button class="secondary" onclick="showStudent()">بازگشت</button></section>
<section class="panel hidden" id="admin"><div class="row"><h2 style="flex:1">پنل مدیریت</h2><button class="secondary" onclick="exitAdmin()">خروج از مدیریت</button></div>
